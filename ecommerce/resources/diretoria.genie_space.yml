                  "id": "e0000000000000000000000000000001",
                  "alias": "ticket_medio",
                  "display_name": "Ticket médio",
                  "sql": [
                    "SUM(vendas_temporais.receita) / SUM(vendas_temporais.total_vendas)"
                  ],
                  "synonyms": [
                    "ticket médio",
                    "valor médio por venda",
                    "tíquete médio"
                  ]
                }
              ]
            }
          }
